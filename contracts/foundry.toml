[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
cbor_metadata = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]
fs_permissions = [{ access = "read", path = "./deployments" }]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 1024
depth = 64

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 128

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
mezo_mainnet = "https://mezo-mainnet.boar.network"
base_sepolia = "https://sepolia.base.org"
